/*
  Netlify configuration — SPA/SSR-safe fallback so deep links and refreshes
  never 404 when the site is deployed from a GitHub repo.
*/
[build]
  command = "bun run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
